name: DevSecOps security checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: scanners do not need repository write access.
permissions:
  contents: read

jobs:
  security:
    name: Tests, SAST and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pinned auditing tools
        run: python -m pip install -r security/requirements-tools.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check Bash syntax
        run: bash -n diagnose.sh

      - name: Bandit SAST (medium and high severity)
        run: python -m bandit -ll demo_service.py

      # This app has no third-party runtime dependencies.
      # The audit below checks the security-tool dependency graph.
      - name: Audit pinned security-tool dependencies
        run: python -m pip_audit -r security/requirements-tools.txt
